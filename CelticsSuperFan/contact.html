<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contact the Celtics Superfan Page or sign up for the newsletter."
    />
    <meta
      name="keywords"
      content="Boston Celtics Contact, Celtics Newsletter"
    />
    <title>Celtics Superfan - Contact & Newsletter</title>
    <link rel="icon" href="assets/images/Celtics.png" type="image/png" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="history.html">History</a></li>
          <li><a href="team.html">Current Team</a></li>
          <li><a href="schedule.html">Upcoming Games</a></li>
          <li><a href="contact.html">Contact/Newsletter</a></li>
        </ul>
        <div class="logo-placeholder">
            <img src="assets/images/Celtics.png" alt="LuckyLogo">
            <span class="site-title">Bleed Green Blog</span>
        </div>
      </nav>
    </header>

    <main>
      <h1>Contact Us & Sign Up</h1>
      <p>Get in touch or subscribe to our fan newsletter.</p>

      <section id="contact-form-section">
        <h2>Send a Message</h2>
        <form id="contact-form" novalidate>
          <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required />
            <span class="error-message" id="name-error"></span>
          </div>
          <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />
            <span class="error-message" id="email-error"></span>
          </div>
          <div>
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            <span class="error-message" id="message-error"></span>
          </div>
          <button type="submit">Send Message</button>
          <div id="form-status"></div>
        </form>
      </section>

      <section id="newsletter-signup">
        <h2>Subscribe to the Newsletter</h2>
        <form id="newsletter-form" novalidate>
          <div>
            <label for="newsletter-email">Email:</label>
            <input
              type="email"
              id="newsletter-email"
              name="newsletter_email"
              required
            />
            <span class="error-message" id="newsletter-email-error"></span>
          </div>
          <button type="submit">Subscribe</button>
          <div id="newsletter-status"></div>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2024 Celtics Superfan Page. All rights reserved.</p>
      <div class="social-links-placeholder">
        <a href="https://x.com/celtics">X</a>
        <a href="https://instagram.com/celtics">Instagram</a>
        <a href="https://youtube.com/celtics">YouTube</a>
        <a href="https://facebook.com/celtics">Facebook</a>
      </div>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        console.log("DOM fully loaded and parsed");

        const currentPage =
          window.location.pathname.split("/").pop() || "index.html";
        const navLinks = document.querySelectorAll("header nav ul li a");
        navLinks.forEach((link) => {
          if (link.getAttribute("href") === currentPage) {
            link.classList.add("active");
          }
        });

        if (document.getElementById("schedule-container")) {
          fetchSchedule();
        }

        const contactForm = document.getElementById("contact-form");
        if (contactForm) {
          contactForm.addEventListener("submit", handleContactFormSubmit);
        }

        const newsletterForm = document.getElementById("newsletter-form");
        if (newsletterForm) {
          newsletterForm.addEventListener("submit", handleNewsletterFormSubmit);
        }
      });

      async function fetchSchedule() {
        const scheduleContainer = document.getElementById("schedule-container");
        try {
          const response = await fetch("assets/js/schedule.json");
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const scheduleData = await response.json();

          scheduleContainer.innerHTML = "";

          if (scheduleData.length === 0) {
            scheduleContainer.innerHTML = "<p>No upcoming games found.</p>";
            return;
          }

          const scheduleList = document.createElement("ul");
          scheduleData.forEach((game) => {
            const listItem = document.createElement("li");
            listItem.textContent = `${game.date} @ ${game.time} vs ${game.opponent} (${game.location})`;
            scheduleList.appendChild(listItem);
          });
          scheduleContainer.appendChild(scheduleList);
        } catch (error) {
          console.error("Error fetching schedule:", error);
          scheduleContainer.innerHTML =
            "<p>Could not load schedule. Please try again later.</p>";
        }
      }

      function handleContactFormSubmit(event) {
        event.preventDefault();
        console.log("Contact form submitted");

        const form = event.target;
        const nameInput = form.elements["name"];
        const emailInput = form.elements["email"];
        const messageInput = form.elements["message"];
        const statusDiv = document.getElementById("form-status");
        let isValid = true;

        clearErrorMessages(form);
        statusDiv.textContent = "";
        statusDiv.style.color = "";

        if (!nameInput.value.trim()) {
          showError(nameInput, "Name is required.");
          isValid = false;
        }
        if (!emailInput.value.trim() || !isValidEmail(emailInput.value)) {
          showError(emailInput, "Please enter a valid email address.");
          isValid = false;
        }
        if (!messageInput.value.trim()) {
          showError(messageInput, "Message cannot be empty.");
          isValid = false;
        }

        if (isValid) {
          console.log("Form is valid. Submitting data (placeholder)...");
          console.log({
            name: nameInput.value,
            email: emailInput.value,
            message: messageInput.value,
          });

          statusDiv.textContent = "Message sent successfully! (Placeholder)";
          statusDiv.style.color = "green";
          form.reset();
        } else {
          statusDiv.textContent = "Please correct the errors above.";
          statusDiv.style.color = "red";
        }
      }

      function handleNewsletterFormSubmit(event) {
        event.preventDefault();
        console.log("Newsletter form submitted");

        const form = event.target;
        const emailInput = form.elements["newsletter_email"];
        const statusDiv = document.getElementById("newsletter-status");
        let isValid = true;

        clearErrorMessages(form);
        statusDiv.textContent = "";
        statusDiv.style.color = "";

        if (!emailInput.value.trim() || !isValidEmail(emailInput.value)) {
          showError(emailInput, "Please enter a valid email address.");
          isValid = false;
        }

        if (isValid) {
          console.log("Newsletter form valid. Subscribing (placeholder)...");
          console.log({ email: emailInput.value });

          statusDiv.textContent = "Subscribed successfully! (Placeholder)";
          statusDiv.style.color = "green";
          form.reset();
        } else {
          statusDiv.textContent = "Please correct the error above.";
          statusDiv.style.color = "red";
        }
      }

      function isValidEmail(email) {
        const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return regex.test(email);
      }

      function showError(inputElement, message) {
        const errorSpan = document.getElementById(`${inputElement.id}-error`);
        if (errorSpan) {
          errorSpan.textContent = message;
        }
        inputElement.style.borderColor = "red";
      }

      function clearErrorMessages(form) {
        const errorMessages = form.querySelectorAll(".error-message");
        errorMessages.forEach((span) => (span.textContent = ""));
        const inputs = form.querySelectorAll("input, textarea");
        inputs.forEach((input) => (input.style.borderColor = ""));
      }
    </script>
  </body>
</html>
